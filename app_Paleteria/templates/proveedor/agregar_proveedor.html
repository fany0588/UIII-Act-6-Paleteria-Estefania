{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">Registrar Proveedor</h2>

  <form method="POST" class="shadow p-4 bg-light rounded">
    {% csrf_token %}

    <div class="row mb-3">
      <div class="col">
        <label for="nombre_empresa">Nombre de la Empresa:</label>
        <input type="text" name="nombre_empresa" class="form-control" required>
      </div>
      <div class="col">
        <label for="contacto">Persona de Contacto:</label>
        <input type="text" name="contacto" class="form-control">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="telefono">Teléfono:</label>
        <input type="text" name="telefono" class="form-control">
      </div>
      <div class="col">
        <label for="email">Correo Electrónico:</label>
        <input type="email" name="email" class="form-control">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="descripcion">Descripción:</label>
        <input type="text" name="descripcion" class="form-control" placeholder="Descripción del proveedor">
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-success px-5">Guardar Proveedor</button>
    </div>
  </form>
</div>
{% endblock %}
