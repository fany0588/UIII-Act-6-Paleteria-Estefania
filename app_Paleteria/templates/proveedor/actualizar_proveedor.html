{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">Actualizar Proveedor</h2>

  <form method="POST" action="{% url 'realizar_actualizacion_proveedor' proveedor.id_proveedor %}" class="shadow p-4 bg-light rounded">
    {% csrf_token %}

    <div class="row mb-3">
      <div class="col">
        <label for="nombre_empresa">Nombre de la Empresa:</label>
        <input type="text" name="nombre_empresa" class="form-control" value="{{ proveedor.nombre_empresa }}" required>
      </div>

      <div class="col">
        <label for="contacto">Persona de Contacto:</label>
        <input type="text" name="contacto" class="form-control" value="{{ proveedor.contacto }}">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="telefono">Teléfono:</label>
        <input type="text" name="telefono" class="form-control" value="{{ proveedor.telefono }}">
      </div>

      <div class="col">
        <label for="email">Correo Electrónico:</label>
        <input type="email" name="email" class="form-control" value="{{ proveedor.email }}">
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="descripcion">Descripción:</label>
        <input type="text" name="descripcion" class="form-control" value="{{ proveedor.descripcion }}">
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary px-5">Guardar Cambios</button>
      <a href="{% url 'ver_proveedor' %}" class="btn btn-secondary px-4">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
