{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2 class="text-center mb-4">Actualizar Empleado</h2>

  <form method="POST" action="{% url 'realizar_actualizacion_empleado' empleado.id_empleado %}" class="shadow p-4 bg-light rounded">
    {% csrf_token %}

    <div class="row mb-3">
      <div class="col">
        <label for="nombre">Nombre:</label>
        <input type="text" name="nombre" class="form-control" value="{{ empleado.nombre }}" required>
      </div>

      <div class="col">
        <label for="apellido">Apellido:</label>
        <input type="text" name="apellido" class="form-control" value="{{ empleado.apellido }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="cargo">Cargo:</label>
        <input type="text" name="cargo" class="form-control" value="{{ empleado.cargo }}" required>
      </div>

      <div class="col">
        <label for="fecha_contratacion">Fecha de Contratación:</label>
        <input type="date" name="fecha_contratacion" class="form-control" value="{{ empleado.fecha_contratacion|date:'Y-m-d' }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="salario">Salario:</label>
        <input type="number" step="0.01" name="salario" class="form-control" value="{{ empleado.salario }}" required>
      </div>

      <div class="col">
        <label for="edad">Edad:</label>
        <input type="number" name="edad" class="form-control" value="{{ empleado.edad }}" required>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col">
        <label for="direccion">Dirección:</label>
        <input type="text" name="direccion" class="form-control" value="{{ empleado.direccion }}" required>
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary px-5">Guardar Cambios</button>
      <a href="{% url 'ver_empleado' %}" class="btn btn-secondary px-4">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
